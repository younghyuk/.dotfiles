# Codex user config template — source of truth for portable, intentional settings.
#
# The live file (~/.codex/config.toml) stays machine-local because Codex writes
# auth-adjacent and machine state into it (project trust, app-managed MCPs,
# local marketplaces, notification paths, and runtime hashes).
#
# New/existing machine: ./sync.sh
# Check drift:          scripts/codex-config-diff.sh
# Intentional change:   update this template, then rerun ./sync.sh

model = "gpt-5.6-sol"
model_reasoning_effort = "max"
model_verbosity = "high"
approval_policy = "never"
sandbox_mode = "workspace-write"
web_search = "live"

[sandbox_workspace_write]
network_access = true

# Codex Plugins / Apps. Installation and connector authentication remain local;
# sync.sh installs CLI-addressable curated plugins and keeps these enable flags.
[plugins."slack@openai-curated"]
enabled = true

[plugins."github@openai-curated"]
enabled = true

[plugins."linear@openai-curated"]
enabled = true

[plugins."notion@openai-curated"]
enabled = true

[plugins."posthog@openai-curated"]
enabled = true

# Context7 connector app (not exposed by `codex plugin add`).
[plugins."app-69ef18c674308191a2f952431f91ea61@openai-curated"]
enabled = true

# Klaviyo connector app (not exposed by `codex plugin add`).
[plugins."app-694421e60cc88191a1e5bb4aa79950e4@openai-curated"]
enabled = true

# Sentry stays project-scoped as a direct MCP integration.
[plugins."sentry@openai-curated"]
enabled = false

[plugins."sites@openai-bundled"]
enabled = true

[plugins."browser@openai-bundled"]
enabled = true

[plugins."chrome@openai-bundled"]
enabled = true

[plugins."visualize@openai-bundled"]
enabled = true

[plugins."computer-use@openai-bundled"]
enabled = true

# Personal/user MCPs. Company/repo MCPs belong in each repo's .codex/config.toml.
[mcp_servers.playwright]
command = "npx"
args = ["-y", "@playwright/mcp@latest"]

[mcp_servers.chrome_devtools]
command = "npx"
args = ["-y", "chrome-devtools-mcp@1.6.0"]

[features]
js_repl = false

[desktop]
localeOverride = "en-US"
followUpQueueMode = "queue"
enabled-reasoning-efforts = ["low", "medium", "high", "xhigh", "ultra", "max"]
keepRemoteControlAwakeWhilePluggedIn = true
git-pull-request-merge-method = "squash"
git-create-pull-request-as-draft = false
